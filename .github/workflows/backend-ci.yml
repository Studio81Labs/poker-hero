name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "solver-plugins/postflop/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "solver-plugins/postflop/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e "apps/backend[dev]"

      - name: Run backend tests
        working-directory: apps/backend
        run: python -m pytest

      - name: Test postflop solver plugin
        run: >-
          docker run --rm
          -v "$PWD/solver-plugins/postflop:/work"
          -w /work
          rust:1.85-slim-bookworm
          cargo test --locked

  image:
    name: Backend Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build backend image
        run: docker build -f apps/backend/Dockerfile -t poker-hero-backend:test .
