name: Frontend Deploy

# Builds the Vite SPA in ./frontend and deploys it to Cloudflare Workers
# Static Assets. This workflow is intentionally single-environment for testing.
#
# Deploy model:
#   push to main       -> testing
#   workflow_dispatch  -> testing
#
# Required repo secret:
#   CLOUDFLARE_API_TOKEN
#
# Required repo vars:
#   CLOUDFLARE_ACCOUNT_ID
#   APP_WORKERS_SUBDOMAIN      e.g. studio81 for *.studio81.workers.dev
#
# Required repo or "testing" environment vars:
#   VITE_API_BASE_URL          Public backend API origin used at build time
#
# Optional repo or "testing" environment vars:
#   APP_WORKER_NAME            Defaults to "poker"

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-workers-testing
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy frontend (Cloudflare Workers)
    runs-on: ubuntu-latest
    environment:
      name: testing
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$VITE_API_BASE_URL" || { echo "::error::VITE_API_BASE_URL repo or testing environment var is required"; exit 1; }
          npm run build

      - name: Deploy to Cloudflare Workers
        id: deploy
        working-directory: frontend
        env:
          CONFIGURED_WORKER_NAME: ${{ vars.APP_WORKER_NAME }}
          WORKERS_SUBDOMAIN: ${{ vars.APP_WORKERS_SUBDOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          WORKER_NAME="${CONFIGURED_WORKER_NAME:-poker}"

          test -n "$WORKERS_SUBDOMAIN" || { echo "::error::APP_WORKERS_SUBDOMAIN repo var is required"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID repo var is required"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN repo secret is required"; exit 1; }

          npx wrangler@latest deploy \
            --config wrangler.jsonc \
            --name "$WORKER_NAME"

          DEPLOY_URL="https://${WORKER_NAME}.${WORKERS_SUBDOMAIN}.workers.dev"
          echo "url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          echo "::notice::Frontend deployed to ${DEPLOY_URL}"

      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            HTTP_CODE=$(curl -sL -o spa.html -w '%{http_code}' "$URL" || echo '000')
            if [ "$HTTP_CODE" = "200" ] && grep -qi "Poker Training Analyzer" spa.html; then
              echo "::notice::Frontend smoke OK (${URL})"
              exit 0
            fi
            echo "Smoke attempt ${attempt}: HTTP=${HTTP_CODE}"
            sleep 5
          done
          echo "::error::Frontend smoke failed for ${URL}"
          exit 1
