name: Frontend Deploy

# Builds the Vite SPA in apps/frontend and deploys it to Cloudflare Workers
# Static Assets.
#
# Deploy model:
#   push to main       -> staging
#   push tag v*        -> production
#   workflow_dispatch  -> choose staging or production
#
# Required repo secret:
#   CLOUDFLARE_API_TOKEN
#
# Required per-environment secret:
#   API_PROXY_SECRET          Shared with backend POKER_PROXY_SHARED_SECRET
#
# Required for staging and before enabling MCP elsewhere:
#   MCP_ADMIN_TOKEN           Unlocks MCP credential management at the Worker
#
# Required repo vars:
#   CLOUDFLARE_ACCOUNT_ID
#   APP_WORKERS_SUBDOMAIN      e.g. studio81 for *.studio81.workers.dev
#
# Required per-environment vars:
#   APP_WORKER_NAME           e.g. poker-staging or poker
#   BACKEND_URL                Backend origin proxied by the Worker, e.g. https://coolify-app.example.com
#
# Optional per-environment vars:
#   VITE_API_BASE_URL          Overrides the browser API base URL; defaults to same-origin in production
#   VITE_SENTRY_DSN            Enables privacy-scrubbed browser error reporting
#
# Optional per-environment secrets for smoke testing Cloudflare Access-protected URLs:
#   CLOUDFLARE_ACCESS_CLIENT_ID
#   CLOUDFLARE_ACCESS_CLIENT_SECRET

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/check-deployment.mjs"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: ["staging", "production"]
        default: "staging"

permissions:
  contents: read

concurrency:
  group: frontend-deploy-${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy frontend (Cloudflare Workers)
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve environment
        id: env
        env:
          INPUT_ENV: ${{ inputs.environment || '' }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -n "$INPUT_ENV" ]; then
            ENV_NAME="$INPUT_ENV"
          elif [ "$IS_TAG" = "true" ]; then
            ENV_NAME="production"
          else
            ENV_NAME="staging"
          fi
          echo "name=${ENV_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ steps.env.outputs.name }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: pnpm frontend:build

      - name: Deploy to Cloudflare Workers
        id: deploy
        working-directory: apps/frontend
        env:
          ENV_NAME: ${{ steps.env.outputs.name }}
          WORKER_NAME: ${{ vars.APP_WORKER_NAME }}
          WORKERS_SUBDOMAIN: ${{ vars.APP_WORKERS_SUBDOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          API_PROXY_SECRET: ${{ secrets.API_PROXY_SECRET }}
          MCP_ADMIN_TOKEN: ${{ secrets.MCP_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WORKER_NAME" || { echo "::error::APP_WORKER_NAME var is not set in env ${ENV_NAME}"; exit 1; }
          test -n "$WORKERS_SUBDOMAIN" || { echo "::error::APP_WORKERS_SUBDOMAIN repo var is required"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID repo var is required"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN repo secret is required"; exit 1; }
          test -n "$BACKEND_URL" || { echo "::error::BACKEND_URL var is not set in env ${ENV_NAME}"; exit 1; }
          test -n "$API_PROXY_SECRET" || { echo "::error::API_PROXY_SECRET secret is not set in env ${ENV_NAME}"; exit 1; }
          if [ "$ENV_NAME" = "staging" ]; then
            test -n "$MCP_ADMIN_TOKEN" || { echo "::error::MCP_ADMIN_TOKEN secret is not set in env ${ENV_NAME}"; exit 1; }
          fi
          if [ -n "$MCP_ADMIN_TOKEN" ] && [ "$MCP_ADMIN_TOKEN" = "$API_PROXY_SECRET" ]; then
            echo "::error::MCP_ADMIN_TOKEN must be different from API_PROXY_SECRET in env ${ENV_NAME}"
            exit 1
          fi
          node -e '
            const backend = new URL(process.env.BACKEND_URL);
            if (process.env.API_PROXY_SECRET && backend.protocol !== "https:") {
              console.error("::error::BACKEND_URL must use HTTPS when API_PROXY_SECRET is configured");
              process.exit(1);
            }
            const adminToken = process.env.MCP_ADMIN_TOKEN;
            if (adminToken && !/^[\x21-\x7e]{32,}$/.test(adminToken)) {
              console.error("::error::MCP_ADMIN_TOKEN must contain at least 32 printable ASCII characters without spaces");
              process.exit(1);
            }
          '

          SECRETS_FILE="${RUNNER_TEMP}/poker-worker-secrets.json"
          trap 'rm -f "$SECRETS_FILE"' EXIT
          node -e \
            'const secrets = {API_PROXY_SECRET: process.env.API_PROXY_SECRET}; if (process.env.MCP_ADMIN_TOKEN) secrets.MCP_ADMIN_TOKEN = process.env.MCP_ADMIN_TOKEN; require("node:fs").writeFileSync(process.argv[1], JSON.stringify(secrets))' \
            "$SECRETS_FILE"

          pnpm dlx wrangler@latest deploy \
            --config wrangler.jsonc \
            --name "$WORKER_NAME" \
            --var "BACKEND_URL:$BACKEND_URL" \
            --secrets-file "$SECRETS_FILE"

          DEPLOY_URL="https://${WORKER_NAME}.${WORKERS_SUBDOMAIN}.workers.dev"
          echo "url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          echo "::notice::Frontend deployed to ${DEPLOY_URL}"

      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          API_PROXY_SECRET: ${{ secrets.API_PROXY_SECRET }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          node scripts/check-deployment.mjs "$URL" \
            --attempts 5 \
            --retry-delay-ms 5000

          # The template expression belongs to Node.js, not the shell.
          # shellcheck disable=SC2016
          DIRECT_API_URL=$(node -e '
            const backend = new URL(process.env.BACKEND_URL);
            const basePath = backend.pathname.replace(/\/+$/, "");
            backend.pathname = basePath.endsWith("/api")
              ? `${basePath}/jobs`
              : `${basePath}/api/jobs`;
            backend.search = "?limit=1";
            backend.hash = "";
            process.stdout.write(backend.href);
          ')
          for attempt in 1 2 3; do
            HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' "$DIRECT_API_URL" || echo '000')
            if [ "$HTTP_CODE" = "401" ]; then
              echo "::notice::Direct backend API correctly rejected an unauthenticated request"
              exit 0
            fi
            echo "Direct backend rejection attempt ${attempt}: HTTP=${HTTP_CODE}"
            sleep 5
          done
          echo "::error::Direct backend API did not return 401 without the Worker credential"
          exit 1
