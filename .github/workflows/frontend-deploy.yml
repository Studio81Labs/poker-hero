name: Frontend Deploy

# Builds the Vite SPA in apps/frontend and deploys it to Cloudflare Workers
# Static Assets. This workflow is intentionally single-environment for testing.
#
# Deploy model:
#   push to main       -> testing
#   workflow_dispatch  -> testing
#
# Required repo secret:
#   CLOUDFLARE_API_TOKEN
#
# Required repo vars:
#   CLOUDFLARE_ACCOUNT_ID
#   APP_WORKERS_SUBDOMAIN      e.g. studio81 for *.studio81.workers.dev
#
# Required repo or "testing" environment vars:
#   BACKEND_URL                Backend origin proxied by the Worker, e.g. http://coolify-app.example.com
#
# Optional repo or "testing" environment vars:
#   APP_WORKER_NAME            Defaults to "poker"
#   VITE_API_BASE_URL          Overrides the browser API base URL; defaults to same-origin in production
#
# Optional repo or "testing" environment secrets for smoke testing Cloudflare Access-protected URLs:
#   CLOUDFLARE_ACCESS_CLIENT_ID
#   CLOUDFLARE_ACCESS_CLIENT_SECRET

on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-workers-testing
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy frontend (Cloudflare Workers)
    runs-on: ubuntu-latest
    environment:
      name: testing
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: pnpm frontend:build

      - name: Deploy to Cloudflare Workers
        id: deploy
        working-directory: apps/frontend
        env:
          CONFIGURED_WORKER_NAME: ${{ vars.APP_WORKER_NAME }}
          WORKERS_SUBDOMAIN: ${{ vars.APP_WORKERS_SUBDOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          set -euo pipefail
          WORKER_NAME="${CONFIGURED_WORKER_NAME:-poker}"

          test -n "$WORKERS_SUBDOMAIN" || { echo "::error::APP_WORKERS_SUBDOMAIN repo var is required"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID repo var is required"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN repo secret is required"; exit 1; }
          test -n "$BACKEND_URL" || { echo "::error::BACKEND_URL repo or testing environment var is required"; exit 1; }

          pnpm dlx wrangler@latest deploy \
            --config wrangler.jsonc \
            --name "$WORKER_NAME" \
            --var "BACKEND_URL:$BACKEND_URL"

          DEPLOY_URL="https://${WORKER_NAME}.${WORKERS_SUBDOMAIN}.workers.dev"
          echo "url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          echo "::notice::Frontend deployed to ${DEPLOY_URL}"

      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
          ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if { [ -n "$ACCESS_CLIENT_ID" ] && [ -z "$ACCESS_CLIENT_SECRET" ]; } || { [ -z "$ACCESS_CLIENT_ID" ] && [ -n "$ACCESS_CLIENT_SECRET" ]; }; then
            echo "::error::Both CLOUDFLARE_ACCESS_CLIENT_ID and CLOUDFLARE_ACCESS_CLIENT_SECRET must be set for Access smoke testing"
            exit 1
          fi

          CURL_ARGS=(-sL)
          if [ -n "$ACCESS_CLIENT_ID" ]; then
            CURL_ARGS+=(-H "CF-Access-Client-Id: ${ACCESS_CLIENT_ID}")
            CURL_ARGS+=(-H "CF-Access-Client-Secret: ${ACCESS_CLIENT_SECRET}")
          fi

          for attempt in 1 2 3 4 5; do
            HTTP_CODE=$(curl "${CURL_ARGS[@]}" -o spa.html -w '%{http_code}' "$URL" || echo '000')
            if [ "$HTTP_CODE" = "200" ] && grep -qi "Poker Training Analyzer" spa.html; then
              echo "::notice::Frontend smoke OK (${URL})"
              break
            fi
            echo "Smoke attempt ${attempt}: HTTP=${HTTP_CODE}"
            sleep 5
            if [ "$attempt" = "5" ]; then
              echo "::error::Frontend smoke failed for ${URL}"
              exit 1
            fi
          done

          for attempt in 1 2 3 4 5; do
            HTTP_CODE=$(curl "${CURL_ARGS[@]}" -o api-health.json -w '%{http_code}' "$URL/api/health" || echo '000')
            if [ "$HTTP_CODE" = "200" ] && grep -q '"status"' api-health.json; then
              echo "::notice::API proxy smoke OK (${URL}/api/health)"
              exit 0
            fi
            echo "API smoke attempt ${attempt}: HTTP=${HTTP_CODE}"
            sleep 5
          done
          echo "::error::API proxy smoke failed for ${URL}/api/health"
          exit 1
