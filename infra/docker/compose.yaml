services:
  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    environment:
      POKER_DATA_DIR: /app/data
      POKER_PARSER_PROVIDER: ${POKER_PARSER_PROVIDER:-ocr_cv}
      POKER_PARSER_LAYOUT_PROFILE: ${POKER_PARSER_LAYOUT_PROFILE:-fortuna_nations}
      POKER_RECOMMENDATION_PROVIDER: ${POKER_RECOMMENDATION_PROVIDER:-local_solver}
      POKER_EXTERNAL_PARSER_URL: ${POKER_EXTERNAL_PARSER_URL:-}
      POKER_EXTERNAL_PARSER_BEARER_TOKEN: ${POKER_EXTERNAL_PARSER_BEARER_TOKEN:-}
      POKER_EXTERNAL_PROVIDER_URL: ${POKER_EXTERNAL_PROVIDER_URL:-}
      POKER_EXTERNAL_PROVIDER_BEARER_TOKEN: ${POKER_EXTERNAL_PROVIDER_BEARER_TOKEN:-}
      POKER_LLM_ADVICE_URL: ${POKER_LLM_ADVICE_URL:-}
      POKER_LLM_ADVICE_BEARER_TOKEN: ${POKER_LLM_ADVICE_BEARER_TOKEN:-}
      POKER_EXTERNAL_REQUEST_TIMEOUT_SECONDS: ${POKER_EXTERNAL_REQUEST_TIMEOUT_SECONDS:-60}
      POKER_LOCAL_SOLVER_COMMAND: ${POKER_LOCAL_SOLVER_COMMAND:-}
      POKER_LOCAL_SOLVER_ENGINE: ${POKER_LOCAL_SOLVER_ENGINE:-postflop_solver}
      POKER_LOCAL_SOLVER_TIMEOUT_SECONDS: ${POKER_LOCAL_SOLVER_TIMEOUT_SECONDS:-120}
      POKER_POSTFLOP_SOLVER_COMMAND: ${POKER_POSTFLOP_SOLVER_COMMAND:-poker-postflop-solver}
      POKER_POSTFLOP_SOLVER_FALLBACK_ENABLED: ${POKER_POSTFLOP_SOLVER_FALLBACK_ENABLED:-true}
      POKER_POSTFLOP_SOLVER_MAX_ITERATIONS: ${POKER_POSTFLOP_SOLVER_MAX_ITERATIONS:-400}
      POKER_POSTFLOP_SOLVER_TARGET_EXPLOITABILITY: ${POKER_POSTFLOP_SOLVER_TARGET_EXPLOITABILITY:-0.01}
      POKER_POSTFLOP_SOLVER_MAX_MEMORY_MB: ${POKER_POSTFLOP_SOLVER_MAX_MEMORY_MB:-768}
      POKER_POSTFLOP_SOLVER_BET_SIZES: ${POKER_POSTFLOP_SOLVER_BET_SIZES:-70%}
      POKER_POSTFLOP_SOLVER_RAISE_SIZES: ${POKER_POSTFLOP_SOLVER_RAISE_SIZES:-2.5x}
      POKER_POSTFLOP_SOLVER_RAKE_RATE: ${POKER_POSTFLOP_SOLVER_RAKE_RATE:-0}
      POKER_POSTFLOP_SOLVER_RAKE_CAP: ${POKER_POSTFLOP_SOLVER_RAKE_CAP:-0}
      POKER_POSTFLOP_SOLVER_OOP_RANGE: ${POKER_POSTFLOP_SOLVER_OOP_RANGE:-66+,A8s+,A5s-A4s,AJo+,K9s+,KQo,QTs+,JTs,96s+,85s+,75s+,65s,54s}
      POKER_POSTFLOP_SOLVER_IP_RANGE: ${POKER_POSTFLOP_SOLVER_IP_RANGE:-QQ-22,AQs-A2s,ATo+,K5s+,KJo+,Q8s+,J8s+,T7s+,96s+,86s+,75s+,64s+,53s+}
      POKER_MAX_UPLOAD_BYTES: ${POKER_MAX_UPLOAD_BYTES:-10485760}
      POKER_MAX_DATASET_UPLOAD_BYTES: ${POKER_MAX_DATASET_UPLOAD_BYTES:-104857600}
      POKER_MAX_BACKUP_UPLOAD_BYTES: ${POKER_MAX_BACKUP_UPLOAD_BYTES:-104857600}
      POKER_PROXY_SHARED_SECRET: ${POKER_PROXY_SHARED_SECRET:-}
      POKER_CORS_ORIGINS: '${POKER_CORS_ORIGINS:-["http://localhost:5173","http://localhost:8080"]}'
    ports:
      - "8000:8000"
    volumes:
      - poker-data:/app/data

  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  poker-data:
